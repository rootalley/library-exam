<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Syllabus Page Prototype (CS 6750)</title>
    <style>
      body {
        margin: 0;
        font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      /* orange bar across the top */
      #alert-banner {
        background: #d04a02;
        color: #fff;
        text-align: center;
        padding: 3px 12px;
        font-size: 14px;
        font-weight: bold;
      }

      /* page is a column: banner on top, then nav + main panel side by side */
      #page {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #below-banner {
        display: flex;
        flex: 1;
      }
      #global-nav {
        width: 84px;
        background: #394b58; /* gray until i pick the gt color */
      }
      #main-panel {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <!-- top alert banner -->
      <div id="alert-banner">Prototype for CS 6750 evaluation. Not real Canvas. Sample data only.</div>

      <div id="below-banner">
        <!-- global navigation goes here -->
        <nav id="global-nav"></nav>

        <!-- main panel goes here -->
        <main id="main-panel"></main>
      </div>
    </div>
  </body>
</html>
